apiVersion: v1
kind: ServiceAccount
metadata:
    name: runner-scheduler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: runner-scheduler-clusteradmin
subjects:
    - kind: ServiceAccount
      name: runner-scheduler
      namespace: kube-system
roleRef:
    kind: ClusterRole
    name: cluster-admin
    apiGroup: rbac.authorization.k8s.io
